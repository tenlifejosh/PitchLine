version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pitchline-db
    environment:
      POSTGRES_DB: pitchline
      POSTGRES_USER: pitchline_user
      POSTGRES_PASSWORD: pitchline_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchline_user -d pitchline"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pitchline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: